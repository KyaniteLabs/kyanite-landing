name: CI

# The only CI for this public repo: GitHub is the trunk and the Forgejo copy is
# a mirror that runs nothing (fleet GIT-CI-STRATEGY-20261123). This job runs
# what the Forgejo ci-profile (.ci/profile.json) ran: production Python, the
# correctness lint, a compile, the tests, and the site served under gunicorn.
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  smoke:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0

      - name: Install production Python 3.14 and pinned test tools
        run: |
          uv venv --python 3.14 .venv
          uv pip install --python .venv -r requirements.txt pytest==9.1.1 ruff==0.17.2

      - name: Lint for correctness errors
        run: .venv/bin/ruff check --isolated --select E9,F app.py agent_discovery.py tests

      - name: Compile shipped modules
        run: .venv/bin/python -m compileall -q app.py agent_discovery.py

      - name: Run all tests
        run: .venv/bin/python -m pytest tests -q --tb=short

      - name: Serve the site under gunicorn and fetch public pages
        shell: bash
        run: |
          set -euo pipefail
          .venv/bin/gunicorn --bind 127.0.0.1:3002 --workers 1 app:app &
          pid=$!
          trap 'kill $pid' EXIT
          for i in $(seq 1 30); do curl -sf -o /dev/null http://127.0.0.1:3002/ && break; sleep 1; done
          for path in / /es/ /llms.txt; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:3002$path")
            echo "$path $code"
            test "$code" = 200
          done
